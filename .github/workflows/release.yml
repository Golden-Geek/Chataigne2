name: Release package qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Clean package smoke (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
          - runner: macos-15
            platform: macos
          - runner: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Read canonical toolchain manifest
        id: pins
        shell: pwsh
        run: |
          $pins = Get-Content tools/bootstrap/toolchain.json -Raw | ConvertFrom-Json
          "node=$($pins.node.version)" >> $env:GITHUB_OUTPUT
          "npm=$($pins.node.npm_version)" >> $env:GITHUB_OUTPUT
          "python=$($pins.python.version)" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.pins.outputs.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.pins.outputs.python }}

      - name: Install pinned Rust toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/bootstrap/install-rust-toolchain.ps1

      - name: Install pinned Rust toolchain (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: sh ./tools/bootstrap/install-rust-toolchain.sh

      - name: Cache default Windows ASIO SDK
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/chataigne-tool-cache/asio-sdk
          key: asio-sdk-${{ hashFiles('tools/bootstrap/toolchain.json') }}

      - name: Configure default Windows ASIO
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "chataigne-tool-cache/asio-sdk"
          $asio = ./tools/asio.ps1 -CacheRoot $cache -SetupOnly -PassThru
          "CPAL_ASIO_DIR=$($asio.sdk_path)" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=$($asio.libclang_path)" >> $env:GITHUB_ENV

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libasound2-dev \
            libjack-jackd2-dev \
            libpipewire-0.3-dev \
            libdbus-1-dev \
            clang \
            libclang-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libudev-dev \
            libusb-1.0-0-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            xvfb

      - name: Verify pinned toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/bootstrap/verify-toolchain.ps1 -CheckInstalled

      - name: Verify pinned toolchain (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: sh ./tools/bootstrap/verify-toolchain.sh --check-installed

      - name: Install locked UI dependencies and browser
        shell: pwsh
        run: |
          npm ci
          npm exec -- playwright-core install chromium

      - name: Build, install/extract, exercise, and clean the package
        if: runner.os != 'Linux'
        shell: pwsh
        run: |
          python tools/qualification/package_smoke.py `
            --platform ${{ matrix.platform }} `
            --output-dir target/qualification/package-ci/${{ matrix.platform }}

      - name: Build and exercise Linux package under a virtual display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a python tools/qualification/package_smoke.py \
            --platform linux \
            --output-dir target/qualification/package-ci/linux

      - name: Upload native packages and smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chataigne-${{ matrix.platform }}-${{ github.sha }}
          path: |
            target/release/bundle/**
            target/qualification/package-ci/${{ matrix.platform }}/**
          if-no-files-found: error
