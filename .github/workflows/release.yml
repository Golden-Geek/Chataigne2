name: Release package qualification

on:
  workflow_dispatch:
    inputs:
      require_signing:
        description: Fail unless native signing and notarization credentials are configured
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  package:
    name: Clean package smoke (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
          - runner: macos-15
            platform: macos
          - runner: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      GC_REQUIRE_SIGNING: ${{ inputs.require_signing && '1' || '0' }}
      APPLE_CERTIFICATE: ${{ inputs.require_signing && secrets.APPLE_CERTIFICATE || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ inputs.require_signing && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      APPLE_ID: ${{ inputs.require_signing && secrets.APPLE_ID || '' }}
      APPLE_PASSWORD: ${{ inputs.require_signing && secrets.APPLE_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ inputs.require_signing && secrets.APPLE_TEAM_ID || '' }}
      APPLE_API_KEY: ${{ inputs.require_signing && secrets.APPLE_API_KEY || '' }}
      APPLE_API_ISSUER: ${{ inputs.require_signing && secrets.APPLE_API_ISSUER || '' }}
      SIGN_KEY: ${{ inputs.require_signing && secrets.LINUX_SIGN_KEY || '' }}
      WINDOWS_TIMESTAMP_URL: ${{ inputs.require_signing && secrets.WINDOWS_TIMESTAMP_URL || '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Read canonical toolchain manifest
        id: pins
        shell: pwsh
        run: |
          $pins = Get-Content tools/bootstrap/toolchain.json -Raw | ConvertFrom-Json
          "node=$($pins.node.version)" >> $env:GITHUB_OUTPUT
          "npm=$($pins.node.npm_version)" >> $env:GITHUB_OUTPUT
          "python=$($pins.python.version)" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.pins.outputs.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.pins.outputs.python }}

      - name: Install pinned Rust toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/bootstrap/install-rust-toolchain.ps1

      - name: Install pinned Rust toolchain (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: sh ./tools/bootstrap/install-rust-toolchain.sh

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libudev-dev \
            libusb-1.0-0-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            xvfb

      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && inputs.require_signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'chataigne-release.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV

      - name: Verify pinned toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/bootstrap/verify-toolchain.ps1 -CheckInstalled

      - name: Verify pinned toolchain (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: sh ./tools/bootstrap/verify-toolchain.sh --check-installed

      - name: Install locked UI dependencies and browser
        shell: pwsh
        run: |
          npm ci
          npm exec -- playwright-core install chromium

      - name: Build, install/extract, exercise, and clean the package
        if: runner.os != 'Linux'
        shell: pwsh
        run: |
          if ($env:GC_REQUIRE_SIGNING -ne '1') {
            @(
              'APPLE_CERTIFICATE',
              'APPLE_CERTIFICATE_PASSWORD',
              'APPLE_ID',
              'APPLE_PASSWORD',
              'APPLE_TEAM_ID',
              'APPLE_API_KEY',
              'APPLE_API_ISSUER',
              'WINDOWS_TIMESTAMP_URL'
            ) | ForEach-Object { Remove-Item -LiteralPath "Env:$_" -ErrorAction SilentlyContinue }
          }
          python tools/migration/run_phase9_package_smoke.py `
            --platform ${{ matrix.platform }} `
            --output-dir target/phase9/package-ci/${{ matrix.platform }}

      - name: Build and exercise Linux package under a virtual display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ "${GC_REQUIRE_SIGNING:-0}" != "1" ]]; then
            unset SIGN_KEY
          fi
          xvfb-run -a python tools/migration/run_phase9_package_smoke.py \
            --platform linux \
            --output-dir target/phase9/package-ci/linux

      - name: Upload native packages and smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chataigne-${{ matrix.platform }}-${{ github.sha }}
          path: |
            target/release/bundle/**
            target/phase9/package-ci/${{ matrix.platform }}/**
          if-no-files-found: error
