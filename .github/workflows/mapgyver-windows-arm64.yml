name: MapGyver Windows ARM64

on:
  push:
    branches: [mapgyver, main]
    tags: ['1.0.0b*']
    paths:
      - '.github/workflows/mapgyver-windows-arm64.yml'
      - 'apps/mapgyver/**'
      - 'crates/golden_video/**'
      - 'tools/mapgyver/**'
      - 'vendor/spout2-sys-0.1.1/**'
      - 'Cargo.lock'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ffmpeg:
    name: Cross-build the pinned Windows ARM64 FFmpeg SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Build FFmpeg DLLs and MSVC import libraries
        run: bash tools/mapgyver/ffmpeg/build-windows-arm64.sh "$RUNNER_TEMP/mapgyver-ffmpeg-arm64"

      - uses: actions/upload-artifact@v7
        with:
          name: mapgyver-ffmpeg-windows-arm64
          path: ${{ runner.temp }}/mapgyver-ffmpeg-arm64
          if-no-files-found: error

  verify-ffmpeg:
    name: Verify FFmpeg with native Windows ARM64
    needs: build-ffmpeg
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: mapgyver-ffmpeg-windows-arm64
          path: ${{ runner.temp }}/mapgyver-ffmpeg-arm64

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: arm64

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Link against the import libraries and run on ARM64
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'mapgyver-ffmpeg-arm64'
          $probe = Join-Path $env:RUNNER_TEMP 'mapgyver-ffmpeg-import-test.exe'
          $object = Join-Path $env:RUNNER_TEMP 'mapgyver-ffmpeg-import-test.obj'
          cl.exe /nologo "/I$sdk/include" "/Fo$object" "/Fe$probe" `
            tools/mapgyver/ffmpeg/tests/windows-arm64-imports.c /link "/LIBPATH:$sdk/lib" `
            avcodec.lib avformat.lib avutil.lib swresample.lib swscale.lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PATH = "$sdk/bin;$env:PATH"
          & $probe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/mapgyver/ffmpeg/tests/source_sdk.py $sdk --pin "$sdk/source-build.json"

  package-mapgyver:
    name: Build and install the Windows ARM64 app
    needs: verify-ffmpeg
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: mapgyver-ffmpeg-windows-arm64
          path: ${{ runner.temp }}/mapgyver-ffmpeg-arm64

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          architecture: arm64

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Set up repository Rust and ASIO build inputs
        shell: pwsh
        run: |
          ./tools/bootstrap/install-rust-toolchain.ps1
          $cache = Join-Path $env:RUNNER_TEMP 'mapgyver-asio-sdk'
          $asio = ./tools/asio.ps1 -CacheRoot $cache -SetupOnly -PassThru
          "CPAL_ASIO_DIR=$($asio.sdk_path)" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=$($asio.libclang_path)" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          key: mapgyver-windows-arm64-${{ hashFiles('Cargo.lock', 'tools/bootstrap/toolchain.json') }}

      - name: Build the workbench and ARM64 NSIS installer
        shell: pwsh
        env:
          MAPGYVER_FFMPEG_ARM64_SDK: ${{ runner.temp }}/mapgyver-ffmpeg-arm64
          GC_UI_ASSUME_BUILT: '1'
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build:mapgyver
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/mapgyver/ffmpeg/with-ffmpeg.ps1 `
            --tauri build --target aarch64-pc-windows-msvc --bundles nsis -- --locked

      - uses: actions/upload-artifact@v7
        with:
          name: mapgyver-windows-arm64-installer
          path: target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Build the independent ARM64 Spout receiver
        if: github.ref_type != 'tag'
        shell: pwsh
        env:
          MAPGYVER_FFMPEG_ARM64_SDK: ${{ runner.temp }}/mapgyver-ffmpeg-arm64
          GC_UI_ASSUME_BUILT: '1'
        run: |
          $env:GC_UI_OUT_DIR = Join-Path $env:GITHUB_WORKSPACE 'packages/golden-video-ui/build'
          npm run build --workspace golden_video_ui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/mapgyver/ffmpeg/with-ffmpeg.ps1 `
            build --release --locked --target aarch64-pc-windows-msvc --package MapGyver `
            --no-default-features --features native-qualification --bin native_qualification

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: arm64

      - name: Install the desktop pixel capture dependency
        run: 'python -m pip install --only-binary=:all: Pillow==13.0.0'

      - name: Verify installed ARM64 startup, authoring and Spout output
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected one MapGyver ARM64 installer.' }
          $sdk = Join-Path $env:RUNNER_TEMP 'mapgyver-ffmpeg-arm64'
          ./apps/mapgyver/tests/package/silent-install.ps1 -Installer $installers[0].FullName -Arm64FfmpegSdk $sdk -AfterStartup {
            param($binary, $evidence, $runtimePin)
            $env:MAPGYVER_TEST_BINARY = $binary
            $env:LOCALAPPDATA = Join-Path $evidence 'desktop-localappdata'
            $env:MAPGYVER_VIDEO_RUNTIME_PIN = $runtimePin
            $receiver = 'target/aarch64-pc-windows-msvc/release/native_qualification.exe'

            node apps/mapgyver/tests/headless/media.mjs 2>&1 | Tee-Object (Join-Path $evidence 'headless-authoring.log')
            if ($LASTEXITCODE) { throw "Headless authoring exited with code $LASTEXITCODE." }

            node apps/mapgyver/tests/native_output/desktop-readiness.mjs 2>&1 |
              Tee-Object (Join-Path $evidence 'desktop-workbench.log')
            if ($LASTEXITCODE) { throw "Native workbench startup exited with code $LASTEXITCODE." }

            if ($env:GITHUB_REF_TYPE -ne 'tag') {
              $env:MAPGYVER_TEST_SPOUT_RECEIVER = (Resolve-Path $receiver).ProviderPath
              node apps/mapgyver/tests/browser/portable-rectangle.mjs --windows-spout 2>&1 |
                Tee-Object (Join-Path $evidence 'spout-video.log')
              if ($LASTEXITCODE) { throw "Native Spout video exited with code $LASTEXITCODE." }
            }
          }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mapgyver-windows-arm64-install-evidence
          path: |
            target/package-smoke/*/*.log
            target/package-smoke/*/video-runtime.json
          if-no-files-found: ignore
