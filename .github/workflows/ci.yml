name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Root fmt
        run: cargo fmt --all --check
      - name: golden_core fmt
        run: cargo fmt --manifest-path submodules/golden_core/Cargo.toml --all --check
      - name: Root check
        run: cargo check
      - name: golden_core check
        run: cargo check --manifest-path submodules/golden_core/Cargo.toml

  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install UI deps
        working-directory: src-ui
        run: npm ci
      - name: UI format
        working-directory: src-ui
        run: npm run lint
      - name: UI check
        working-directory: src-ui
        run: npm run check
