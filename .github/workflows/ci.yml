name: Golden workspace CI

on:
  push:
    branches: [main, rewrite/golden-architecture]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 24.18.0

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Install JavaScript workspace
        run: npm ci
      - name: Validate architecture contract
        run: python tools/check_architecture_contract.py
      - name: Validate workspace dependency direction
        run: python tools/check_workspace_architecture.py
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --all-features
      - name: JavaScript type check
        run: npm run check
      - name: JavaScript tests
        run: npm test
      - name: JavaScript build gate
        run: npm run build
      - name: Production JavaScript dependency audit
        run: npm audit --omit=dev --audit-level=high
