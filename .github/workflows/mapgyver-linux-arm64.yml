name: MapGyver Linux ARM64 package

on:
  push:
    branches: [mapgyver, main]
    paths:
      - '.github/workflows/mapgyver-linux-arm64.yml'
      - '.cargo/**'
      - 'apps/mapgyver/**'
      - 'crates/**'
      - 'packages/**'
      - 'tools/bootstrap/**'
      - 'tools/mapgyver/**'
      - 'tools/product-gate/hooks/**'
      - 'Cargo.*'
      - 'package*.json'
      - '.nvmrc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  arm64-package:
    name: Build and test the Debian 13 ARM64 package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned Rust toolchain
        run: sh tools/bootstrap/install-rust-toolchain.sh

      - name: Build against Debian 13 libraries on native ARM64
        id: package
        shell: bash
        run: |
          test "$(uname -m)" = aarch64
          output="$RUNNER_TEMP/mapgyver-debian-13-arm64"
          mkdir -p "$output"
          node=$(dirname "$(dirname "$(realpath "$(command -v node)")")")
          rust=$(rustc --print sysroot)
          git archive HEAD | docker run --rm -i \
            -v "$node:/opt/node:ro" \
            -v "$rust:/opt/rust:ro" \
            -v "$output:/artifacts" \
            debian:trixie bash -euo pipefail -c '
              export PATH="/opt/rust/bin:/opt/node/bin:$PATH"
              mkdir /workbench
              cd /workbench
              tar -xf -
              bash tools/mapgyver/install-linux-build-dependencies.sh
              npm ci
              npm run package:mapgyver:linux
              install -m 0644 target/release/bundle/deb/*.deb /artifacts/
            '
          shopt -s nullglob
          packages=("$output"/*.deb)
          test "${#packages[@]}" -eq 1
          test "$(dpkg-deb -f "${packages[0]}" Architecture)" = arm64
          printf 'path=%s\n' "${packages[0]}" >> "$GITHUB_OUTPUT"

      - name: Install and verify the ARM64 package in clean Debian 13
        env:
          MAPGYVER_TEST_PACKAGE: ${{ steps.package.outputs.path }}
        run: bash apps/mapgyver/tests/native_output/check-linux-install.sh "$MAPGYVER_TEST_PACKAGE" debian:trixie

      - name: Save the install-checked ARM64 package
        uses: actions/upload-artifact@v7
        with:
          name: mapgyver2-debian-13-arm64
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

      - name: Verify workbench, media and display output in clean Debian 13
        env:
          MAPGYVER_TEST_PACKAGE: ${{ steps.package.outputs.path }}
        run: |
          npm ci
          bash apps/mapgyver/tests/native_output/check-linux-desktop.sh "$MAPGYVER_TEST_PACKAGE" debian:trixie
