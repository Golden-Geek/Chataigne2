name: MapGyver platform checks

on:
  push:
    branches: [mapgyver, main]
  pull_request:
    paths:
      - '.cargo/**'
      - '.github/workflows/mapgyver-platform.yml'
      - 'apps/mapgyver/**'
      - 'crates/**'
      - 'packages/**'
      - 'tools/bootstrap/**'
      - 'tools/mapgyver/**'
      - 'tools/product-gate/hooks/**'
      - 'Cargo.*'
      - 'package*.json'
      - '.nvmrc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let a running platform qualification finish before the next mapgyver milestone starts.
  cancel-in-progress: ${{ github.ref != 'refs/heads/mapgyver' }}

jobs:
  macos-workbench:
    name: MapGyver macOS bundle (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned Rust toolchain
        run: sh ./tools/bootstrap/install-rust-toolchain.sh

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mapgyver-macos-bundle-${{ matrix.architecture }}
          cache-targets: false

      - name: Install workbench dependencies
        run: npm ci

      - name: Install the Intel FFmpeg assembler
        if: matrix.architecture == 'x86_64'
        run: brew install nasm

      - name: Build the native app and its pinned FFmpeg libraries
        run: npm run package:mapgyver:macos -- --debug

      - name: Relocate and validate the signed bundle
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          relocated="$RUNNER_TEMP/MapGyver QA/MapGyver 2.app"
          ditto 'target/debug/bundle/macos/MapGyver 2.app' "$relocated"
          binary=$(bash apps/mapgyver/tests/native_output/check-macos-bundle.sh "$relocated" "$ARCHITECTURE")
          printf 'MAPGYVER_TEST_BINARY=%s\n' "$binary" >> "$GITHUB_ENV"

      - name: Check project authoring, history and Save/New/Load
        run: node apps/mapgyver/tests/headless/media.mjs

      - name: Start the native desktop and verify workbench readiness
        shell: pwsh
        run: |
          . ./tools/product-gate/hooks/smoke-common.ps1
          $env:XDG_DATA_HOME = Join-Path $env:RUNNER_TEMP 'mapgyver-desktop-data'
          $mapgyver = $env:MAPGYVER_TEST_BINARY
          $shutdown = Join-Path $env:RUNNER_TEMP 'mapgyver-desktop.stop'
          Invoke-RootCommandSmoke `
            -Id 'mapgyver-macos-workbench' `
            -Command $mapgyver `
            -CommandArguments @('--no-remote', '--automation-shutdown-file', ('"' + $shutdown + '"')) `
            -FrontendUri 'http://127.0.0.1:7010/' `
            -Ports @(7010) `
            -ShutdownFile $shutdown

      - name: Install the FFmpeg command used to create test clips
        run: brew install ffmpeg

      - name: Check bundled media decoding, Media Preview and Screen Warping
        env:
          GC_UI_BROWSER_CHANNEL: chrome
        run: node apps/mapgyver/tests/browser/portable-preview.mjs

      - name: Check native Rectangle and Fullscreen Screen pixels
        run: node apps/mapgyver/tests/browser/portable-rectangle.mjs

  linux-workbench:
    name: MapGyver Debian package, desktop and preview (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned Rust toolchain
        run: sh ./tools/bootstrap/install-rust-toolchain.sh

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mapgyver-linux-workbench
          cache-targets: false

      - name: Install the Linux desktop, audio and video dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang libclang-dev pkg-config dpkg-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libjack-jackd2-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev \
            ffmpeg mesa-vulkan-drivers xvfb xauth x11-utils weston xdotool

      - name: Install workbench dependencies
        run: npm ci

      - name: Build the native Debian package
        run: npm run package:mapgyver:linux -- --debug

      - name: Install and check the package in clean Ubuntu
        run: |
          shopt -s nullglob
          packages=(target/debug/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          package=$(realpath "${packages[0]}")
          bash apps/mapgyver/tests/native_output/check-linux-install.sh "$package" ubuntu:24.04
          sudo apt-get install -y "$package"
          printf 'MAPGYVER_TEST_BINARY=/usr/bin/mapgyver2\n' >> "$GITHUB_ENV"

      - name: Verify the native X11 workbench
        env:
          GDK_BACKEND: x11
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: xvfb-run -a node apps/mapgyver/tests/native_output/desktop-readiness.mjs

      - name: Check local media and portable GPU Screen Warping
        env:
          GC_UI_BROWSER_CHANNEL: chrome
        run: node apps/mapgyver/tests/browser/portable-preview.mjs

      - name: Check X11 Rectangle and Fullscreen Screen pixels and bounds
        env:
          GDK_BACKEND: x11
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: xvfb-run -a -s '-screen 0 1280x1024x24' node apps/mapgyver/tests/browser/portable-rectangle.mjs

      - name: Check selected Wayland outputs with Weston
        run: |
          for scales in 1,1 2,2 1,2 2,1; do
            xvfb-run -a -s '-screen 0 2560x1200x24' +              bash apps/mapgyver/tests/native_output/check-wayland-output.sh "${scales%,*}" "${scales#*,}"
          done

      - name: Save the verified test package
        uses: actions/upload-artifact@v7
        with:
          name: mapgyver2-ubuntu-24.04-amd64-debug
          path: target/debug/bundle/deb/*.deb
          if-no-files-found: error
