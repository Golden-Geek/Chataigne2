name: MapGyver platform checks

on:
  push:
    branches: [mapgyver, main]
    tags: ['1.0.0b*']
  pull_request:
    paths:
      - '.cargo/**'
      - '.github/workflows/mapgyver-platform.yml'
      - 'apps/mapgyver/**'
      - 'crates/**'
      - 'packages/**'
      - 'tools/bootstrap/**'
      - 'tools/mapgyver/**'
      - 'tools/product-gate/hooks/**'
      - 'Cargo.*'
      - 'package*.json'
      - '.nvmrc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let a running platform qualification finish before the next mapgyver milestone starts.
  cancel-in-progress: ${{ github.ref != 'refs/heads/mapgyver' }}

jobs:
  macos-workbench:
    name: MapGyver macOS bundle (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    timeout-minutes: 60
    env:
      MAPGYVER_PROFILE: ${{ github.ref_type == 'tag' && 'release' || 'debug' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned Rust toolchain
        run: sh ./tools/bootstrap/install-rust-toolchain.sh

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mapgyver-macos-bundle-${{ matrix.architecture }}
          cache-targets: false

      - name: Install workbench dependencies
        run: npm ci

      - name: Install the Intel FFmpeg assembler
        if: matrix.architecture == 'x86_64'
        run: brew install nasm

      - name: Build the native app and its pinned FFmpeg libraries
        shell: bash
        run: |
          args=()
          if [[ "$MAPGYVER_PROFILE" == debug ]]; then args=(-- --debug); fi
          npm run package:mapgyver:macos "${args[@]}"

      - name: Relocate and validate the signed bundle
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          relocated="$RUNNER_TEMP/MapGyver QA/MapGyver 2.app"
          ditto "target/$MAPGYVER_PROFILE/bundle/macos/MapGyver 2.app" "$relocated"
          binary=$(bash apps/mapgyver/tests/native_output/check-macos-bundle.sh "$relocated" "$ARCHITECTURE")
          printf 'MAPGYVER_TEST_BINARY=%s\n' "$binary" >> "$GITHUB_ENV"

      - name: Check project authoring, history and Save/New/Load
        run: node apps/mapgyver/tests/headless/media.mjs

      - name: Start the native desktop and verify workbench readiness
        shell: pwsh
        run: |
          . ./tools/product-gate/hooks/smoke-common.ps1
          $env:XDG_DATA_HOME = Join-Path $env:RUNNER_TEMP 'mapgyver-desktop-data'
          $mapgyver = $env:MAPGYVER_TEST_BINARY
          $shutdown = Join-Path $env:RUNNER_TEMP 'mapgyver-desktop.stop'
          Invoke-RootCommandSmoke `
            -Id 'mapgyver-macos-workbench' `
            -Command $mapgyver `
            -CommandArguments @('--no-remote', '--automation-shutdown-file', ('"' + $shutdown + '"')) `
            -FrontendUri 'http://127.0.0.1:7010/' `
            -Ports @(7010) `
            -ShutdownFile $shutdown

      - name: Install the FFmpeg command used to create test clips
        run: brew install ffmpeg

      - name: Check bundled media decoding, Media Preview and Screen Warping
        env:
          GC_UI_BROWSER_CHANNEL: chrome
        run: node apps/mapgyver/tests/browser/portable-preview.mjs

      - name: Check native Rectangle and Fullscreen Screen pixels
        run: node apps/mapgyver/tests/browser/portable-rectangle.mjs

      - name: Archive the release app bundle
        if: github.ref_type == 'tag'
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            'target/release/bundle/macos/MapGyver 2.app' \
            "target/MapGyver2-$GITHUB_REF_NAME-macos-$ARCHITECTURE.zip"

      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: mapgyver2-macos-${{ matrix.architecture }}-release
          path: target/MapGyver2-*-macos-${{ matrix.architecture }}.zip
          if-no-files-found: error

  linux-workbench:
    name: MapGyver Debian package, desktop and preview (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MAPGYVER_PROFILE: ${{ github.ref_type == 'tag' && 'release' || 'debug' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned Rust toolchain
        run: sh ./tools/bootstrap/install-rust-toolchain.sh

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mapgyver-linux-workbench
          cache-targets: false

      - name: Install the Linux desktop, audio and video dependencies
        run: sudo bash tools/mapgyver/install-linux-build-dependencies.sh

      - name: Install workbench dependencies
        run: npm ci

      - name: Build the native Debian package
        shell: bash
        run: |
          args=()
          if [[ "$MAPGYVER_PROFILE" == debug ]]; then args=(-- --debug); fi
          npm run package:mapgyver:linux "${args[@]}"

      - name: Install and check the package in clean Ubuntu
        run: |
          shopt -s nullglob
          packages=(target/"$MAPGYVER_PROFILE"/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          package=$(realpath "${packages[0]}")
          bash apps/mapgyver/tests/native_output/check-linux-install.sh "$package" ubuntu:24.04
          printf 'MAPGYVER_TEST_PACKAGE=%s\n' "$package" >> "$GITHUB_ENV"

      - name: Save the install-checked test package
        uses: actions/upload-artifact@v7
        with:
          name: mapgyver2-ubuntu-24.04-amd64-${{ env.MAPGYVER_PROFILE }}
          path: target/${{ env.MAPGYVER_PROFILE }}/bundle/deb/*.deb
          if-no-files-found: error

      - name: Verify workbench, media and display output in clean Ubuntu
        run: bash apps/mapgyver/tests/native_output/check-linux-desktop.sh "$MAPGYVER_TEST_PACKAGE" ubuntu:24.04

  windows-x64-release:
    name: MapGyver Windows x64 installer
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          architecture: x64

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: x64

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Rust and ASIO build inputs
        shell: pwsh
        run: |
          ./tools/bootstrap/install-rust-toolchain.ps1
          $asio = ./tools/asio.ps1 -CacheRoot (Join-Path $env:RUNNER_TEMP 'mapgyver-asio-sdk') -SetupOnly -PassThru
          "CPAL_ASIO_DIR=$($asio.sdk_path)" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=$($asio.libclang_path)" >> $env:GITHUB_ENV

      - name: Build the Windows NSIS package
        shell: pwsh
        env:
          GC_UI_ASSUME_BUILT: '1'
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run package:mapgyver -- --without-bundled-ndi -- --locked

      - name: Verify the installer and archive corresponding source
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected one MapGyver Windows x64 installer.' }
          ./apps/mapgyver/tests/package/silent-install.ps1 -Installer $installers[0].FullName
          Copy-Item -LiteralPath $installers[0].FullName -Destination "target/MapGyver2-$env:GITHUB_REF_NAME-windows-x64-setup.exe"
          tar -czf "target/MapGyver2-$env:GITHUB_REF_NAME-ffmpeg-source.tar.gz" -C target/ffmpeg-source/source-kit .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: mapgyver2-windows-x64-release
          path: |
            target/MapGyver2-*-windows-x64-setup.exe
            target/MapGyver2-*-ffmpeg-source.tar.gz
          if-no-files-found: error
