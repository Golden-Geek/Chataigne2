name: Phase 0 Product Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-gate:
    name: Product gate (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-15
          - platform: linux
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Read canonical toolchain manifest
        id: pins
        shell: pwsh
        run: |
          $pins = Get-Content tools/bootstrap/toolchain.json -Raw | ConvertFrom-Json
          "rust=$($pins.rust.channel)" >> $env:GITHUB_OUTPUT
          "node=$($pins.node.version)" >> $env:GITHUB_OUTPUT
          "npm=$($pins.node.npm_version)" >> $env:GITHUB_OUTPUT
          "python=$($pins.python.version)" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.pins.outputs.node }}
          cache: npm
          cache-dependency-path: src-ui/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.pins.outputs.python }}

      - name: Install pinned Rust toolchain (Windows MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/bootstrap/install-rust-toolchain.ps1

      - name: Install pinned Rust toolchain (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: sh ./tools/bootstrap/install-rust-toolchain.sh

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            submodules/golden_core -> submodules/golden_core/target

      - name: Enable MSVC build environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify Windows Tauri prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { throw 'MSVC cl.exe is unavailable.' }
          $webView = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\EdgeWebView\Application'
          if (-not (Test-Path $webView)) {
            throw 'The GitHub Windows image does not contain the WebView2 runtime required by Tauri.'
          }

      - name: Verify macOS Tauri prerequisites
        if: runner.os == 'macOS'
        shell: bash
        run: |
          xcode-select -p
          xcrun --find clang

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libudev-dev \
            libusb-1.0-0-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget \
            xvfb

      - name: Verify canonical installed toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/bootstrap/verify-toolchain.ps1 -CheckInstalled

      - name: Verify canonical installed toolchain (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: sh ./tools/bootstrap/verify-toolchain.sh --check-installed

      - name: Run product gate
        if: runner.os != 'Linux'
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'product-gate/${{ matrix.platform }}/product-gate-report.json'
          ./tools/product-gate/product-gate.ps1 -ReportPath $report -RequiredPlatforms '${{ matrix.platform }}'

      - name: Run product gate under virtual display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          report="$RUNNER_TEMP/product-gate/${{ matrix.platform }}/product-gate-report.json"
          xvfb-run -a pwsh -NoLogo -NoProfile -NonInteractive -File ./tools/product-gate/product-gate.ps1 \
            -ReportPath "$report" \
            -RequiredPlatforms '${{ matrix.platform }}'

      - name: Upload platform report, logs, and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase0-product-gate-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/product-gate/${{ matrix.platform }}
            src-ui/artifacts
          if-no-files-found: warn

  compatibility-build:
    name: Compatibility build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-armhf
            runner: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
            emulated_arch: armv7
            emulated_distro: ubuntu24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            install_linux_deps: true
          - platform: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Read canonical toolchain manifest
        id: pins
        shell: pwsh
        run: |
          $pins = Get-Content tools/bootstrap/toolchain.json -Raw | ConvertFrom-Json
          "python=$($pins.python.version)" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v6
        if: matrix.platform != 'linux-armhf'
        with:
          python-version: ${{ steps.pins.outputs.python }}

      - name: Install pinned Rust toolchain and target (Windows ARM64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/bootstrap/install-rust-toolchain.ps1
          rustup target add '${{ matrix.target }}'

      - name: Install pinned Rust toolchain and target (Linux AArch64)
        if: matrix.platform == 'linux-aarch64'
        shell: bash
        run: |
          sh ./tools/bootstrap/install-rust-toolchain.sh
          rustup target add '${{ matrix.target }}'

      - uses: Swatinem/rust-cache@v2
        if: matrix.platform != 'linux-armhf'
        with:
          key: compatibility-${{ matrix.target }}
          workspaces: |
            . -> target
            submodules/golden_core -> submodules/golden_core/target

      - name: Enable ARM64 MSVC build environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Install Linux ARM64 desktop prerequisites
        if: matrix.install_linux_deps
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libudev-dev \
            libusb-1.0-0-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget

      - name: Build native ARM64 compatibility target
        if: matrix.platform != 'linux-armhf'
        shell: pwsh
        run: |
          python tools/product-gate/compatibility_gate.py `
            --platform '${{ matrix.platform }}' `
            --target '${{ matrix.target }}' `
            --report 'target/product-gate-compat/${{ matrix.platform }}/product-gate-report.json'

      - name: Check emulated Linux ARM hard-float headless core
        if: matrix.platform == 'linux-armhf'
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.emulated_arch }}
          distro: ${{ matrix.emulated_distro }}
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q -y
            apt-get install -q -y \
              build-essential \
              clang \
              curl \
              file \
              git \
              libasound2-dev \
              libclang-dev \
              libusb-1.0-0-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              libssl-dev \
              libudev-dev \
              libwebkit2gtk-4.1-dev \
              libxdo-dev \
              llvm-dev \
              pkg-config \
              python3 \
              wget
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain none
          run: |
            git config --global --add safe.directory "$PWD"
            . "$HOME/.cargo/env"
            RUST_TOOLCHAIN="$(python3 -c 'import json; m=json.load(open("tools/bootstrap/toolchain.json")); print(m["rust"]["channel"] + "-" + m["rust"]["hosts"]["linux_armv7"])')"
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
            rustup override set "$RUST_TOOLCHAIN"
            rustup target add '${{ matrix.target }}'
            export LIBCLANG_PATH="$(llvm-config --libdir)"
            python3 tools/product-gate/compatibility_gate.py \
              --platform '${{ matrix.platform }}' \
              --target '${{ matrix.target }}' \
              --scope headless-core \
              --report 'target/product-gate-compat/${{ matrix.platform }}/product-gate-report.json'

      - name: Upload compatibility report and log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase0-product-gate-${{ matrix.platform }}-${{ github.sha }}
          path: target/product-gate-compat/${{ matrix.platform }}
          if-no-files-found: error

  aggregate:
    name: Aggregate exact-commit reports
    if: always()
    needs: [product-gate, compatibility-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: phase0-product-gate-*-${{ github.sha }}
          path: reports
      - name: Aggregate schema-v1 reports
        shell: pwsh
        run: ./tools/product-gate/aggregate-reports.ps1 -ReportDirectory ./reports -ExpectedCommit '${{ github.sha }}' -OutputPath ./reports/product-gate-aggregate.json
      - name: Upload aggregate and source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase0-product-gate-aggregate-${{ github.sha }}
          path: reports
          if-no-files-found: error
