name: Publish MapGyver 2 beta

on:
  push:
    tags: ['1.0.0b*']

permissions:
  contents: read

jobs:
  desktop:
    uses: ./.github/workflows/mapgyver-platform.yml

  linux-arm:
    uses: ./.github/workflows/mapgyver-linux-arm.yml

  windows-arm64:
    uses: ./.github/workflows/mapgyver-windows-arm64.yml

  publish:
    name: Publish the CI-verified installers
    needs: [desktop, linux-arm, windows-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: mapgyver*
          path: packages-to-publish

      - name: Verify the tag and collect release files
        shell: bash
        run: |
          tag=$GITHUB_REF_NAME
          [[ "$tag" =~ ^([0-9]+\.[0-9]+\.[0-9]+)b([1-9][0-9]*)$ ]]
          version="${BASH_REMATCH[1]}-beta.${BASH_REMATCH[2]}"
          test "$(jq -r .version apps/mapgyver/tauri.conf.json)" = "$version"
          test -s "apps/mapgyver/releases/$tag.md"
          mkdir release
          shopt -s nullglob
          collect() {
            local artifact=$1 pattern=$2 suffix=$3
            local files=(packages-to-publish/"$artifact"/$pattern)
            test "${#files[@]}" -eq 1
            test -s "${files[0]}"
            cp -- "${files[0]}" "release/MapGyver2-$tag-$suffix"
          }
          collect mapgyver2-macos-arm64-release '*.zip' macos-arm64.zip
          collect mapgyver2-macos-x86_64-release '*.zip' macos-x86_64.zip
          collect mapgyver2-ubuntu-24.04-amd64-release '*.deb' ubuntu-24.04-amd64.deb
          collect mapgyver2-debian-13-arm64 '*.deb' debian-13-arm64.deb
          collect mapgyver2-debian-13-armhf '*.deb' debian-13-armhf.deb
          collect mapgyver2-windows-x64-release '*-setup.exe' windows-x64-setup.exe
          collect mapgyver2-windows-x64-release '*.tar.gz' ffmpeg-source.tar.gz
          collect mapgyver-windows-arm64-installer '*-setup.exe' windows-arm64-setup.exe

      - name: Publish the GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          gh release create "$tag" release/* --verify-tag --prerelease --latest=false \
            --title "MapGyver 2 $tag" --notes-file "apps/mapgyver/releases/$tag.md"
          published=$(gh release view "$tag" --json isDraft,isPrerelease,assets \
            --jq 'if .isDraft or (.isPrerelease | not) then error("Unexpected release state") else .assets[].name end' | sort)
          expected=$(find release -maxdepth 1 -type f -printf '%f\n' | sort)
          test "$published" = "$expected"
