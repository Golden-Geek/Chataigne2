[package]
name = "golden_audio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Application-agnostic real-time audio engine and device foundation for Golden applications"

[features]
default = ["analysis", "desktop", "playback"]
analysis = ["dep:realfft"]
desktop = ["dep:cpal"]
playback = ["dep:symphonia"]
asio = ["desktop", "cpal/asio", "dep:asio-sys"]
jack = ["desktop", "cpal/jack"]
native-pipewire = ["desktop", "cpal/pipewire"]
realtime = ["desktop", "cpal/realtime", "dep:audio_thread_priority"]
realtime-dbus = ["realtime", "cpal/realtime-dbus", "audio_thread_priority/with_dbus"]
full-desktop = ["asio", "jack", "native-pipewire", "realtime-dbus"]
codegen = ["dep:ts-rs"]

[dependencies]
audio_thread_priority = { workspace = true, optional = true }
asio-sys = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
rtrb.workspace = true
rubato.workspace = true
realfft = { workspace = true, optional = true }
serde.workspace = true
symphonia = { workspace = true, optional = true }
thiserror.workspace = true
ts-rs = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
allocation-counter.workspace = true
base64.workspace = true
criterion.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[[bin]]
name = "generate_golden_audio_contract"
path = "src/bin/generate_golden_audio_contract.rs"
required-features = ["codegen"]

[[example]]
name = "backend_probe"
path = "examples/backend_probe.rs"
required-features = ["desktop"]

[[example]]
name = "backend_smoke"
path = "examples/backend_smoke.rs"
required-features = ["desktop"]

[[example]]
name = "reference_qualification"
path = "examples/reference_qualification.rs"
required-features = ["analysis", "playback"]

[[example]]
name = "managed_device_soak"
path = "examples/managed_device_soak.rs"
required-features = ["analysis", "desktop", "playback"]

[[bench]]
name = "render"
harness = false

[[bench]]
name = "routing"
harness = false

[[bench]]
name = "playback"
harness = false
required-features = ["playback"]

[[bench]]
name = "analysis"
harness = false
required-features = ["analysis"]

[[bench]]
name = "reference_workloads"
harness = false
required-features = ["analysis", "playback"]
