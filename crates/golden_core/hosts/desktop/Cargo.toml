[package]
name = "golden_host_desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dirs = "6"
golden_engine = { path = "../../engine" }
golden_transport_server = { path = "../transport" }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native platform types are validated against this Tauri minor.
tauri = { version = "~2.11.5", features = ["unstable"] }
ts-rs.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
core-graphics = "=0.25.0"
objc2 = "0.6"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSGraphics", "NSScreen", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSDictionary", "NSEnumerator", "NSString", "NSValue"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
] }
