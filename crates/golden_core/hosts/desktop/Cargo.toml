[package]
name = "golden_host_desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dirs = "6"
golden_engine = { path = "../../engine" }
golden_transport_server = { path = "../transport" }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native platform types are validated against this Tauri minor.
tauri = "~2.11.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
