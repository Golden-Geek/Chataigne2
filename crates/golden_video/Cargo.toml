[package]
name = "golden_video"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "App-neutral video render plans and worker-owned resource foundations"

[features]
ffmpeg = ["dep:ffmpeg-next", "dep:snap", "dep:cc", "dep:bindgen"]
d3d11 = ["dep:windows", "dep:spout2-sys", "dep:concurrent-queue"]
qualification = ["d3d11", "windows/Win32_Graphics_Direct3D_Fxc", "spout2-sys/qualification"]

[dependencies]
ffmpeg-next = { version = "=9.0.0", default-features = false, features = ["format", "software-scaling"], optional = true }
snap = { version = "=1.1.1", optional = true }
fontdue = "=0.9.4"
golden_assets.workspace = true
golden_io.workspace = true
golden_time.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
cc = { version = "=1.11.1", optional = true }
bindgen = { version = "=0.72.1", optional = true }
font8x8 = "=0.3.1"

[target.'cfg(windows)'.build-dependencies]
windows = { version = "=0.61.3", features = ["Win32_Graphics_Direct3D_Fxc"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.61.3", features = ["Win32_Graphics_Direct3D_Fxc"] }

[target.'cfg(windows)'.dependencies]
concurrent-queue = { version = "=2.5.0", optional = true }
spout2-sys = { version = "=0.1.1", default-features = false, features = ["dx"], optional = true }
windows = { version = "=0.61.3", optional = true, features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Security",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }
