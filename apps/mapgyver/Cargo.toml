[package]
name = "MapGyver"
version = "0.1.0"
edition.workspace = true
license.workspace = true
default-run = "MapGyver"

[lib]
name = "mapgyver"

[features]
native-video = ["golden_video/d3d11"]
native-presentation-smoke = ["dep:windows"]
native-video-smoke = ["native-video", "dep:golden_time", "dep:windows"]
native-preview-smoke = ["native-video-smoke"]
native-qualification = ["native-preview-smoke", "golden_video/qualification", "tauri/unstable"]

[dependencies]
golden_assets.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
png = "=0.18.1"
golden_core = { path = "../../crates/golden_core" }
golden_io.workspace = true
uuid.workspace = true
golden_video = { path = "../../crates/golden_video" }
golden_time = { workspace = true, optional = true }
serde_json.workspace = true
serde.workspace = true
ts-rs.workspace = true
tauri = { version = "2", features = [] }

[build-dependencies]
golden_codegen_support = { path = "../../crates/golden_core/support/codegen" }
tauri-build = "2"

[dev-dependencies]
golden_time.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", optional = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Performance", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "native_presentation_smoke"
path = "tests/native_presentation/smoke.rs"
test = false
bench = false
required-features = ["native-presentation-smoke"]

[[bin]]
name = "native_video_smoke"
path = "tests/native_video/smoke.rs"
test = false
bench = false
required-features = ["native-video-smoke"]

[[bin]]
name = "native_preview_smoke"
path = "tests/native_preview/smoke.rs"
test = false
bench = false
required-features = ["native-preview-smoke"]

[[bin]]
name = "native_qualification"
path = "tests/native_qualification/runner.rs"
test = false
bench = false
required-features = ["native-qualification"]

[[bin]]
name = "native_source_fixture"
path = "tests/native_video/source_fixture.rs"
test = false
bench = false
required-features = ["native-video-smoke"]
