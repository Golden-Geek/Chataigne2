[package]
name = "MapGyver"
version = "0.1.0"
edition.workspace = true
license.workspace = true
default-run = "MapGyver"

[features]
native-presentation-smoke = ["dep:windows"]
native-video-smoke = ["dep:golden_video", "golden_video/d3d11", "dep:golden_time", "dep:windows"]

[dependencies]
golden_core = { path = "../../crates/golden_core" }
golden_video = { path = "../../crates/golden_video", optional = true }
golden_time = { workspace = true, optional = true }
serde_json.workspace = true
tauri = { version = "2", features = [] }

[build-dependencies]
golden_codegen_support = { path = "../../crates/golden_core/support/codegen" }
tauri-build = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", optional = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "native_presentation_smoke"
path = "tests/native_presentation/smoke.rs"
test = false
bench = false
required-features = ["native-presentation-smoke"]

[[bin]]
name = "native_video_smoke"
path = "tests/native_video/smoke.rs"
test = false
bench = false
required-features = ["native-video-smoke"]

[[bin]]
name = "native_source_fixture"
path = "tests/native_video/source_fixture.rs"
test = false
bench = false
required-features = ["native-video-smoke"]
