[package]
name = "Chataigne2"
version = "0.1.0"
edition = "2021"
license.workspace = true
default-run = "Chataigne2"

[package.metadata.cargo-machete]
ignored = ["golden_codegen_support", "tauri-build"]

[features]
# Real Elgato Stream Deck hardware support (native hidapi 2.x + image).
# Off by default so engine-only builds/CI stay free of native deps.
# Requires joycon-rs on hidapi 2.x (see the git pin below) so only one crate
# links the native `hidapi` library.
streamdeck-hid = ["dep:elgato-streamdeck", "dep:image"]

[dependencies]
base64 = "0.22"
buttplug = "10.0.3"
buttplug_core = "10.0.3"
chataigne_state_machine = { path = "state_machine" }
device_query = "4.0.1"
dirs = "6"
elgato-streamdeck = { version = "0.13", optional = true }
futures-util = "0.3"
golden_core = { path = "../../crates/core_facade" }
golden_alchemist.workspace = true
gilrs = "0.11.1"
if-addrs = "0.15.0"
image = { version = "0.25", optional = true }
# Pinned to the hidapi 2.x branch so the native `hidapi` link is shared with
# elgato-streamdeck (Cargo allows only one crate to link `hidapi`).
joycon-rs = { git = "https://github.com/KaiseiYokoyama/joycon-rs", branch = "dependabot/cargo/hidapi-2.2" }
leap-sys = "0.2.0"
libloading = "0.8"
midir = "0.11.0"
midly = "0.5.3"
mio = { version = "1.2", features = ["net", "os-poll"] }
notify = "8.2"
regex = "1"
reqwest = { version = "0.13", features = ["blocking", "form", "json", "multipart"] }
rosc = "0.11.4"
rumqttc = { version = "0.25.1", default-features = false }
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
sysinfo = "0.39.1"
tauri = "2"
tokio = { version = "1", features = ["net", "rt", "time"] }
tokio-tungstenite = "0.29"
rdev = "0.5.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
	"Win32_Foundation",
	"Win32_System_LibraryLoader",
	"Win32_System_Threading",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
golden_codegen_support = { path = "../../crates/codegen_support" }
tauri-build = "2"
