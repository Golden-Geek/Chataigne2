[package]
name = "Chataigne2"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
	"crates/chataigne_alchemist",
	"crates/chataigne_state_machine",
	"crates/golden_alchemist",
	"crates/golden_statechart",
]
exclude = ["submodules/golden_core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Golden Geek <contact@goldengeek.com>"]
license = "MIT"
repository = "https://github.com/Golden-Geek/Chataigne2"

[workspace.dependencies]
chataigne_alchemist = { path = "crates/chataigne_alchemist" }
golden_alchemist = { path = "crates/golden_alchemist" }
golden_statechart = { path = "crates/golden_statechart" }
serde = { version = "1", features = ["derive"] }

[features]
# Real Elgato Stream Deck hardware support.
#
# NOTE: currently a placeholder. `elgato-streamdeck` requires `hidapi 2.x`, which
# conflicts with the `hidapi 1.x` pulled in by `joycon-rs` (both declare
# `links = "hidapi"`, which Cargo forbids). Wire a concrete HID backend to this
# feature once the dependency conflict is resolved (see streamdeck_runtime.rs).
streamdeck-hid = []

[dependencies]
artnet_protocol = "0.4.4"
buttplug = "10.0.2"
device_query = "4.0.1"
futures-util = "0.3"
golden_core = { path = "submodules/golden_core/crates/core_facade" }
gilrs = "0.11.1"
if-addrs = "0.15.0"
joycon-rs = "0.6.3"
leap-sys = "0.2.0"
libloading = "0.8"
midir = "0.11.0"
midly = "0.5.3"
mio = { version = "1.2", features = ["net", "os-poll"] }
open_dmx = "1.1.1"
rand = "0.10.0"
reqwest = { version = "0.13", features = ["blocking", "form", "json", "multipart"] }
rosc = "0.11.4"
rumqttc = { version = "0.25.1", default-features = false }
sacn = "0.11.1"
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
sysinfo = "0.39.1"
tauri = "2"
tokio = { version = "1", features = ["net", "rt", "time"] }
tokio-tungstenite = "0.29"
rust_dmx = "0.7.0"
rdev = "0.5.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
	"Win32_Foundation",
	"Win32_System_LibraryLoader",
	"Win32_System_Threading",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
golden_codegen_support = { path = "submodules/golden_core/crates/codegen_support" }
tauri-build = "2"
