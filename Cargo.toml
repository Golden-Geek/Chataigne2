[workspace]
members = [
    "apps/chataigne",
    "apps/chataigne/alchemist",
    "apps/chataigne/processor",
    "apps/chataigne/state_machine",
    "crates/codegen_support",
    "crates/application",
    "crates/core",
    "crates/core_facade",
    "crates/core_macros",
    "crates/context",
    "crates/condition",
    "crates/graph",
    "crates/io",
    "crates/model",
    "crates/parameters",
    "crates/golden_statechart",
    "crates/values",
    "crates/host_desktop",
    "crates/persistence",
    "crates/protocol",
    "crates/runtime",
    "crates/script",
    "crates/transport_server",
    "xtask",
]
default-members = ["apps/chataigne"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Golden Geek <contact@goldengeek.com>"]
license = "MIT"
repository = "https://github.com/Golden-Geek/Chataigne2"

[workspace.dependencies]
artnet_protocol = "0.4.4"
atomic-write-file = "0.3.0"
chataigne_alchemist = { path = "apps/chataigne/alchemist" }
chataigne_processor = { path = "apps/chataigne/processor" }
delaunator = "1.1.0"
golden_application = { path = "crates/application" }
golden_context = { path = "crates/context" }
golden_condition = { path = "crates/condition" }
golden_graph = { path = "crates/graph" }
golden_io = { path = "crates/io" }
golden_model = { path = "crates/model" }
golden_parameters = { path = "crates/parameters" }
golden_persistence = { path = "crates/persistence" }
golden_runtime = { path = "crates/runtime" }
golden_statechart = { path = "crates/golden_statechart" }
golden_values = { path = "crates/values" }
indexmap = { version = "2", features = ["serde"] }
regex = "1"
sacn = "0.11.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
smallvec = { version = "1", features = ["serde"] }
smol_str = { version = "0.3", features = ["serde"] }
thiserror = "2"
tempfile = "3"
ts-rs = { version = "12", features = ["serde-json-impl", "uuid-impl"] }
uuid = { version = "1", features = ["serde", "v4"] }
arc-swap = "1"

[[workspace.metadata.docs.rs]]
all-features = true

[profile.release]
opt-level = 3
lto = true

# Keep local Rust artifacts bounded. Full dependency debug info and incremental
# caches multiply rapidly across the workspace and are not required for normal
# development or test backtraces.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.test.package."*"]
debug = false
