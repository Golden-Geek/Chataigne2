[workspace]
members = [
    "apps/chataigne",
    "apps/chataigne/systems/alchemist",
    "apps/chataigne/systems/alchemist/condition",
    "apps/chataigne/systems/alchemist/processor",
    "apps/chataigne/systems/state_machine/model",
    "apps/chataigne/systems/state_machine/runtime",
    "apps/chataigne/systems/sound_card_protocol",
    "apps/chataigne/systems/spatializer_protocol",
    "xtask",
]
exclude = ["golden"]
default-members = ["apps/chataigne"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Golden Geek <contact@goldengeek.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/Golden-Geek/Chataigne2"

[workspace.dependencies]
allocation-counter = "0.8.1"
artnet_protocol = "0.4.4"
chataigne_alchemist = { path = "apps/chataigne/systems/alchemist" }
chataigne_condition = { path = "apps/chataigne/systems/alchemist/condition" }
chataigne_processor = { path = "apps/chataigne/systems/alchemist/processor" }
chataigne_state_machine = { path = "apps/chataigne/systems/state_machine/runtime" }
chataigne_state_machine_model = { path = "apps/chataigne/systems/state_machine/model" }
chataigne_sound_card_protocol = { path = "apps/chataigne/systems/sound_card_protocol" }
chataigne_spatializer_protocol = { path = "apps/chataigne/systems/spatializer_protocol" }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
delaunator = "1.1.0"
golden_audio = { path = "golden/crates/golden_audio" }
golden_codegen_support = { path = "golden/crates/golden_core/support/codegen" }
golden_core = { path = "golden/crates/golden_core" }
golden_engine = { path = "golden/crates/golden_core/engine" }
golden_graph = { path = "golden/crates/golden_graph" }
golden_io = { path = "golden/crates/golden_core/runtime/io" }
golden_model = { path = "golden/crates/golden_core/foundation/model" }
golden_values = { path = "golden/crates/golden_core/foundation/values" }
indexmap = { version = "2", features = ["serde"] }
regex = "1"
sacn = { package = "x39-sacn", version = "0.2.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
smallvec = { version = "1", features = ["serde"] }
smol_str = { version = "0.3", features = ["serde"] }
thiserror = "2"
tempfile = "3"
# Serde-only validation attributes (e.g. deny_unknown_fields on enums) do not affect
# TypeScript shapes. Keep serde compatibility while silencing ts-rs's unsupported-attribute warnings.
ts-rs = { version = "12", features = ["serde-json-impl", "uuid-impl", "no-serde-warnings"] }
uuid = { version = "1", features = ["serde", "v4"] }

[[workspace.metadata.docs.rs]]
all-features = true

[patch.crates-io]
wry = { path = "golden/vendor/wry-0.55.1" }

[profile.release]
opt-level = 3
lto = true

# Bound development disk usage while retaining line tables for backtraces.
# Opt in to incremental compilation per session with CARGO_INCREMENTAL=1.
[profile.dev]
debug = "line-tables-only"
incremental = false
opt-level = 1

# Omit dependency debug information; they are still moderately optimized by the
# dev profile so ordinary runs remain useful during feature work.
[profile.dev.package."*"]
debug = false

# Use this profile when development runs need representative engine performance.
# The ordinary dev profile also backs `cargo test-fast` for focused feature tests.
[profile.dev-perf]
inherits = "dev"
incremental = false
opt-level = 3

[profile.test]
debug = "line-tables-only"
incremental = false
opt-level = 3

# Keep performance guards representative of optimized development runs.
[profile.test.package."*"]
debug = false
