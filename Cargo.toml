[workspace]
members = [
    "apps/chataigne",
    "apps/chataigne/systems/alchemist",
    "apps/chataigne/systems/alchemist/condition",
    "apps/chataigne/systems/alchemist/processor",
    "apps/chataigne/systems/state_machine/model",
    "apps/chataigne/systems/state_machine/runtime",
    "crates/golden_core",
    "crates/golden_core/engine",
    "crates/golden_core/foundation/application",
    "crates/golden_core/foundation/context",
    "crates/golden_core/foundation/model",
    "crates/golden_core/foundation/parameters",
    "crates/golden_core/foundation/values",
    "crates/golden_core/hosts/desktop",
    "crates/golden_core/hosts/transport",
    "crates/golden_core/runtime/control",
    "crates/golden_core/runtime/io",
    "crates/golden_core/runtime/script",
    "crates/golden_core/services/persistence",
    "crates/golden_core/services/protocol",
    "crates/golden_core/support/codegen",
    "crates/golden_core/support/macros",
    "crates/golden_audio",
    "crates/golden_graph",
    "xtask",
]
default-members = ["apps/chataigne"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Golden Geek <contact@goldengeek.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/Golden-Geek/Chataigne2"

[workspace.dependencies]
artnet_protocol = "0.4.4"
atomic-write-file = "0.3.0"
chataigne_alchemist = { path = "apps/chataigne/systems/alchemist" }
chataigne_condition = { path = "apps/chataigne/systems/alchemist/condition" }
chataigne_processor = { path = "apps/chataigne/systems/alchemist/processor" }
chataigne_state_machine = { path = "apps/chataigne/systems/state_machine/runtime" }
chataigne_state_machine_model = { path = "apps/chataigne/systems/state_machine/model" }
delaunator = "1.1.0"
golden_application = { path = "crates/golden_core/foundation/application" }
golden_audio = { path = "crates/golden_audio" }
golden_context = { path = "crates/golden_core/foundation/context" }
golden_graph = { path = "crates/golden_graph" }
golden_io = { path = "crates/golden_core/runtime/io" }
golden_model = { path = "crates/golden_core/foundation/model" }
golden_parameters = { path = "crates/golden_core/foundation/parameters" }
golden_persistence = { path = "crates/golden_core/services/persistence" }
golden_runtime = { path = "crates/golden_core/runtime/control" }
golden_values = { path = "crates/golden_core/foundation/values" }
indexmap = { version = "2", features = ["serde"] }
regex = "1"
sacn = "0.11.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
smallvec = { version = "1", features = ["serde"] }
smol_str = { version = "0.3", features = ["serde"] }
thiserror = "2"
tempfile = "3"
ts-rs = { version = "12", features = ["serde-json-impl", "uuid-impl"] }
uuid = { version = "1", features = ["serde", "v4"] }
arc-swap = "1"
allocation-counter = "0.8.1"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[workspace.metadata.docs.rs]]
all-features = true

[profile.release]
opt-level = 3
lto = true

# Keep local Rust artifacts bounded. Full dependency debug info and incremental
# caches multiply rapidly across the workspace and are not required for normal
# development or test backtraces.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.test.package."*"]
debug = false
