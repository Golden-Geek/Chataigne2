[workspace]
members = [
    "apps/chataigne/backend",
    "crates/golden-codegen",
    "crates/golden-alchemist",
    "crates/golden-condition",
    "crates/golden-context",
    "crates/golden-graph",
    "crates/golden-host",
    "crates/golden-io",
    "crates/golden-model",
    "crates/golden-parameters",
    "crates/golden-processor",
    "crates/golden-protocol",
    "crates/golden-runtime",
    "crates/golden-script",
    "crates/golden-transport",
    "crates/golden-statechart",
    "crates/golden-values",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Golden Geek <contact@goldengeek.com>"]
license = "MIT"
repository = "https://github.com/Golden-Geek/Golden"

[workspace.dependencies]
golden-context = { path = "crates/golden-context" }
golden-codegen = { path = "crates/golden-codegen" }
golden-graph = { path = "crates/golden-graph" }
golden-host = { path = "crates/golden-host" }
golden-io = { path = "crates/golden-io" }
golden-alchemist = { path = "crates/golden-alchemist" }
golden-condition = { path = "crates/golden-condition" }
golden-model = { path = "crates/golden-model" }
golden-parameters = { path = "crates/golden-parameters" }
golden-processor = { path = "crates/golden-processor" }
golden-protocol = { path = "crates/golden-protocol" }
golden-runtime = { path = "crates/golden-runtime" }
golden-script = { path = "crates/golden-script" }
golden-transport = { path = "crates/golden-transport" }
golden-values = { path = "crates/golden-values" }
golden-statechart = { path = "crates/golden-statechart" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
smol_str = { version = "0.3", features = ["serde"] }
thiserror = "2"
arc-swap = "1"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }

[profile.release]
opt-level = 3
lto = true
