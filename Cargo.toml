[workspace]
members = [
    "apps/chataigne",
    "apps/chataigne/state_machine",
    "crates/codegen_support",
    "crates/application",
    "crates/core",
    "crates/core_facade",
    "crates/core_macros",
    "crates/golden_alchemist",
    "crates/golden_statechart",
    "crates/host_desktop",
    "crates/persistence",
    "crates/protocol",
    "crates/script",
    "crates/transport_server",
    "xtask",
]
default-members = ["apps/chataigne"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Golden Geek <contact@goldengeek.com>"]
license = "MIT"
repository = "https://github.com/Golden-Geek/Chataigne2"

[workspace.dependencies]
golden_alchemist = { path = "crates/golden_alchemist" }
golden_application = { path = "crates/application" }
golden_statechart = { path = "crates/golden_statechart" }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
smallvec = { version = "1", features = ["serde"] }
smol_str = { version = "0.3", features = ["serde"] }
thiserror = "2"
ts-rs = { version = "12", features = ["serde-json-impl", "uuid-impl"] }
uuid = { version = "1", features = ["serde", "v4"] }

[[workspace.metadata.docs.rs]]
all-features = true

[profile.release]
opt-level = 3
lto = true
