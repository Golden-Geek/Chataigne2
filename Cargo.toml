[package]
name = "Chataigne2"
version = "0.1.0"
edition = "2021"

[dependencies]
buttplug = "10.0.2"
futures-util = "0.3"
golden_core = { path = "submodules/golden_core/crates/core_facade" }
gilrs = "0.11.1"
if-addrs = "0.15.0"
midir = "0.11.0"
midly = "0.5.3"
rand = "0.10.0"
reqwest = { version = "0.13", features = ["blocking", "form", "json", "multipart"] }
rosc = "0.11.4"
rumqttc = { version = "0.25.1", default-features = false }
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
tokio = { version = "1", features = ["net", "rt", "time"] }
tokio-tungstenite = "0.29"

[build-dependencies]
golden_codegen_support = { path = "submodules/golden_core/crates/codegen_support" }
tauri-build = "2"
