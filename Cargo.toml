[workspace]
members = [
    "crates/codegen_support",
    "crates/core",
    "crates/core_facade",
    "crates/core_macros",
    "crates/host_desktop",
    "crates/persistence",
    "crates/protocol",
    "crates/script",
    "crates/transport_server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Golden Geek <contact@goldengeek.com>"]
license = "MIT"
repository = "https://github.com/Golden-Geek/golden_core"

[workspace.dependencies]
ts-rs = { version = "12", features = ["serde-json-impl", "uuid-impl"] }

[[workspace.metadata.docs.rs]]
all-features = true

[profile.release]
opt-level = 3
lto = true
