[package]
name = "mapgyver_native_probe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "mapgyver_native_probe"

[features]
desktop = ["dep:tauri", "dep:tauri-build", "dep:webview2-com", "tauri/custom-protocol", "tauri/unstable"]

[dependencies]
serde.workspace = true
# Exact derived-summary verification crosses the child JSON boundary.
serde_json = { workspace = true, features = ["float_roundtrip"] }
ts-rs.workspace = true

[build-dependencies]
cc = "1"
serde_json.workspace = true
tauri-build = { version = "=2.6.3", optional = true }

[target.'cfg(windows)'.dependencies]
spout2-sys = { version = "=0.1.1", default-features = false, features = ["dx"] }
tauri = { version = "=2.11.5", optional = true }
webview2-com = { version = "=0.38.2", optional = true }
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
